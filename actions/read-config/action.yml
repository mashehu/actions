name: Read pipeline metadata
description: >-
  Reads the pipeline metadata nf-core/tools writes to .nf-core.yml (the template
  version and the pipeline name) and exposes it as outputs. CI settings are not
  read here: they are typed inputs on each reusable workflow.
author: nf-core

inputs:
  config-file:
    description: >-
      Path to the pipeline's .nf-core.yml, relative to the workspace. An
      absolute path is rejected.
    required: false
    default: .nf-core.yml

outputs:
  nf-core-version:
    description: >-
      nf-core template version from 'nf_core_version' in .nf-core.yml, as a
      plain string. Empty string if not present.
  pipeline-name:
    description: >-
      Pipeline name from 'template.name' in .nf-core.yml, as a plain string.
      Empty string if not present.

runs:
  using: node24
  main: dist/index.js
